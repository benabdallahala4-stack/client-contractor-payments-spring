name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start PostgreSQL and Kafka
        run: docker compose --profile test up -d --wait postgres-test kafka
      - name: Verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55436/client_contractor_payments_test
          TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:29092
        run: chmod +x mvnw && ./mvnw --batch-mode clean verify
      - name: Container logs on failure
        if: failure()
        run: docker compose logs postgres-test kafka
