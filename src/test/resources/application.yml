spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:55436/client_contractor_payments_test}
    username: ${TEST_DATABASE_USER:lab}
    password: ${TEST_DATABASE_PASSWORD:lab}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${TEST_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
payments:
  outbox:
    enabled: false
    topic: job-paid.v1
    batch-size: 25
    poll-delay: 1s
    lease: 30s
    base-retry-delay: 5s
    maximum-retry-delay: 5m
    worker-count: 2
